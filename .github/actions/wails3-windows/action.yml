name: "Build the Windows app (Wails v3)"
description: >-
  Builds the application for Windows with the mingw-w64 toolchain and packs the
  executable with its plugin bundle into a zip. The siblings are wails3-macos and
  wails3-linux. Read the header comment for the two Windows-only decisions.

# ---------------------------------------------------------------------------------------
# The toolchain is mingw-w64 from MSYS2, never MSVC.
#
# cgo cannot drive MSVC: it passes GCC-style flags and links through the C driver, and the
# OpenFX host support archive is built by CMake from the same sources on every platform. So
# CMake is given Ninja from MSYS2 and the same gcc that cgo uses, which keeps one compiler in
# the build instead of two that disagree about the ABI.
#
# The MSYS2 step is `msys2/setup-msys2`, but nothing here runs in its shell. A composite
# action cannot set `defaults.run.shell: msys2 {0}` - that is a job-level default - and the
# frontend steps need Git Bash anyway, because `npm` is a shell script there. So the action
# takes the install location the setup step reports and puts mingw64/bin on PATH instead.
# Every step is then Git Bash, with one compiler configuration for all of them.
#
# The layout is the one internal/adapter/ofxhost/bundled.go already searches:
#
#   ofxhost.exe
#   Resources\OfxHost.ofx.bundle\Contents\Win64\OfxHost.ofx
#
# The plugin binary goes in Contents\Win64, the directory OFX discovery reads on this
# platform. A bundle under Contents\MacOS is found by no host, and the failure is an empty
# effect picker rather than an error.
#
# No `go test ./...`. The adapter tests load the fixture plugin through the OpenFX host, which
# is compiled here but not yet proven on this platform, and a red Windows job would hide the
# build failure the job exists to report. PLAN.md §4 records the same reason.
# ---------------------------------------------------------------------------------------

inputs:
  build-name:
    description: "Base name of the archive. Also what the executable is called."
    required: false
    default: ofxhost
  build-platform:
    description: "Target platform. windows/x86_64 or windows/amd64, nothing else for now."
    required: false
    default: windows/x86_64
  go-version:
    description: "Go version to install."
    required: false
    default: '1.26'
  node-version:
    description: "Node version to install."
    required: false
    default: '22'
  wails-version:
    description: "Wails v3 CLI version to install. Pinned, not latest."
    required: false
    default: v3.1.0
  task-version:
    description: "go-task version to install."
    required: false
    default: v3.54.0
  version:
    description: "Version string to embed with -X main.version. The About panel shows it."
    required: false
    default: 'dev'
  package:
    description: "Write the checksum and upload the zip as an artifact."
    required: false
    default: 'true'

outputs:
  arch:
    description: "Architecture as the artifact names it: x86_64."
    value: ${{ steps.target.outputs.arch }}
  archive:
    description: "Path to the zip, empty when package is false."
    value: ${{ steps.package.outputs.path }}

runs:
  using: "composite"
  steps:
    - name: Resolve the target
      id: target
      shell: bash
      env:
        BUILD_PLATFORM: ${{ inputs.build-platform }}
      run: |
        case "$BUILD_PLATFORM" in
          windows/x86_64|windows/amd64)
            arch=x86_64
            goarch=amd64
            ;;
          *)
            echo "unsupported build-platform: $BUILD_PLATFORM" >&2
            echo "this workflow builds windows/x86_64 only" >&2
            exit 1
            ;;
        esac
        echo "arch=$arch" >> "$GITHUB_OUTPUT"
        echo "goarch=$goarch" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # libraw decodes the RAW, lcms2 does the colour conversion, expat parses the plugin XML and
    # the rest write the export formats. gcc, cmake and ninja because cgo and CMake both need
    # one toolchain, and MSVC is not one cgo can drive.
    #
    # path-type inherit is what puts the Go and Node directories of this job inside the MSYS2
    # environment: the shell that builds is MSYS2's, so a tool that only exists on the Windows
    # PATH would otherwise be invisible there.
    #
    # lerc, jbigkit and gcc-libs are named even though pacman installs them as dependencies:
    # the static link in internal/adapter/ofxhost/cgo_windows.go names -lLerc, -ljbig and
    # -lgomp, and a missing one fails as "cannot find -lLerc", which says nothing about the
    # package that would have provided it.
    - name: Set up MSYS2 and install the toolchain
      id: msys2
      uses: msys2/setup-msys2@v2.33.0
      with:
        msystem: MINGW64
        path-type: inherit
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-binutils
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-make
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-libraw
          mingw-w64-x86_64-lcms2
          mingw-w64-x86_64-expat
          mingw-w64-x86_64-libpng
          mingw-w64-x86_64-libtiff
          mingw-w64-x86_64-libjpeg-turbo
          mingw-w64-x86_64-libwebp
          mingw-w64-x86_64-libjxl
          mingw-w64-x86_64-lerc
          mingw-w64-x86_64-jbigkit
          mingw-w64-x86_64-gcc-libs

    # Everything after this step runs in Git Bash, so the compiler has to be on the Windows
    # PATH too: that is where cgo and the checks below find it. The MSYS2 shell is used for the
    # build steps themselves.
    - name: Put the mingw toolchain on PATH
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:MSYS2_LOCATION 'mingw64\bin')

    - name: Check the toolchain is what the link will use
      shell: bash
      run: |
        gcc --version | head -1
        cmake --version | head -1
        # cgo resolves these from PATH. A missing one is a link error much later, in a message
        # that names the library rather than the missing compiler.
        command -v gcc > /dev/null || { echo "gcc is not on PATH"; exit 1; }
        command -v ninja > /dev/null || { echo "ninja is not on PATH"; exit 1; }

    # cgo links build/ofxhost-native/lib/libofxhost.a, which CMake produces. The plugins are
    # built by the same command, and OFX loads them from a bundle on disk.
    #
    # This runs in MSYS2's own shell, not Git Bash. Invoking mingw's gcc with nothing but
    # mingw64/bin on the Windows PATH is not the environment MSYS2 supports, and it fails in
    # the standard C++ headers: `cstdlib:83 #include_next <stdlib.h>` reported the file
    # missing, and CMake reported `Detecting CXX compiler ABI info - failed` before it. The
    # search list is printed first, so a repeat failure names the directory that is absent
    # instead of only the header.
    - name: Build the native library and the bundled plugins
      shell: bash
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        cat > .ci-native.sh <<'SCRIPT'
        set -euo pipefail
        echo "MSYSTEM=${MSYSTEM:-<unset>}"
        echo "compiler: $(command -v g++)"
        g++ -v -E -x c++ /dev/null 2>&1 | sed -n '/#include <...>/,/End of search list/p' || true
        ls -l "$(dirname "$(command -v g++)")/../x86_64-w64-mingw32/include/stdlib.h" || true
        pacman -Q mingw-w64-x86_64-gcc mingw-w64-x86_64-crt 2>/dev/null || true
        cmake -S internal/adapter/ofxhost/native \
              -B build/ofxhost-native \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release
        cmake --build build/ofxhost-native --parallel
        SCRIPT
        MSYS_BASH="$(cygpath -u "$MSYS2_LOCATION")/usr/bin/bash.exe"
        test -x "$MSYS_BASH" || { echo "no MSYS2 bash at $MSYS_BASH"; exit 1; }
        # MSYS2_PATH_TYPE=inherit is stated here rather than trusted to the action: with the
        # default, the MSYS2 environment keeps only the base Windows paths and would not see
        # the Go toolchain or go-task, which live in the runner's tool cache and GOPATH.
        MSYSTEM=MINGW64 MSYS2_PATH_TYPE=inherit \
          "$MSYS_BASH" -lc "cd '$(pwd -W)' && bash .ci-native.sh"

    - name: Verify the native build produced what the link needs
      shell: bash
      run: |
        test -f build/ofxhost-native/lib/libofxhost.a \
          || { echo "libofxhost.a is missing; the CMake step did not run or failed"; exit 1; }
        test -f build/ofxhost-native/bundled/OfxHost.ofx.bundle/Contents/Win64/OfxHost.ofx \
          || { echo "the bundled plugins are not in Contents/Win64"; exit 1; }

    - name: Install build tools
      shell: bash
      env:
        WAILS_VERSION: ${{ inputs.wails-version }}
        TASK_VERSION: ${{ inputs.task-version }}
      run: |
        go install "github.com/go-task/task/v3/cmd/task@${TASK_VERSION}"
        go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: npm ci

    - name: Generate the Wails bindings
      shell: bash
      run: wails3 generate bindings

    # The layer guard is pure Go and catches the one mistake a build cannot: an import that
    # points the wrong way across the layers.
    - name: Check the layer rule
      shell: bash
      run: go run ./tools/layerguard

    # The frontend is built here, in Git Bash, because that is where npm works: on Windows npm
    # is a shell script beside node, and the MSYS2 shell that compiles the adapters is not the
    # environment for it. `task` is the project's own path and carries the right flags for a
    # production or development bundle.
    - name: Build the frontend
      shell: bash
      run: task common:build:frontend

    # CGO_ENABLED=1 is not the Taskfile's default for Windows: its `build` task defaults it to
    # 0 and would produce a stub without the RAW decoder or the OpenFX host.
    #
    # The compile runs in MSYS2's shell, because cgo calls mingw's gcc and that compiler needs
    # the environment it was built for. Git Bash can see gcc but the C++ standard headers do
    # not resolve there: `cstdlib:83 #include_next <stdlib.h>` reports the file missing.
    #
    # `go` is named explicitly. MSYS2's login shell keeps only the base Windows paths, so the
    # runner's Go toolchain and GOPATH are not on its PATH, and `go: command not found` was
    # the first thing this step did. Nothing else is needed inside: npm, wails3 and task stay
    # in Git Bash, so this is a plain `go build` with the flags the Taskfile's windows build
    # uses. They are copied rather than invoked because `task windows:build` would pull npm
    # and wails3 into this shell.
    - name: Build the executable
      shell: bash
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        GOARCH: ${{ steps.target.outputs.goarch }}
        APP_NAME: ${{ inputs.build-name }}
        VERSION: ${{ inputs.version }}
      run: |
        # Paths are resolved here, where Go's environment is intact, and pasted into the script
        # that runs in the other shell. Inside MSYS2 the module cache cannot be found at all:
        # `go: module cache not found: neither GOMODCACHE nor GOPATH is set`, because the login
        # shell does not pass the profile that Go would derive them from.
        GO_DIR="$(cygpath -u "$(dirname "$(command -v go)")")"
        GO_PATH="$(cygpath -m "$(go env GOPATH)")"
        GO_MODCACHE="$(cygpath -m "$(go env GOMODCACHE)")"
        GO_CACHE="$(cygpath -m "$(go env GOCACHE)")"
        cat > .ci-build.sh <<SCRIPT
        set -euo pipefail
        export PATH="${GO_DIR}:/mingw64/bin:/usr/bin:\$PATH"
        export GOPATH="${GO_PATH}"
        export GOMODCACHE="${GO_MODCACHE}"
        export GOCACHE="${GO_CACHE}"
        export GOOS=windows
        export GOARCH=${GOARCH}
        export CGO_ENABLED=1
        go version
        gcc --version | head -1
        mkdir -p bin
        go build -tags production -trimpath -buildvcs=false \
          -ldflags="-w -s -H windowsgui -X main.version=${VERSION}" \
          -o "bin/${APP_NAME}.exe" ./cmd/ofxhost
        SCRIPT
        MSYS_BASH="$(cygpath -u "$MSYS2_LOCATION")/usr/bin/bash.exe"
        test -x "$MSYS_BASH" || { echo "no MSYS2 bash at $MSYS_BASH"; exit 1; }
        MSYSTEM=MINGW64 "$MSYS_BASH" -lc "cd '$(pwd -W)' && bash .ci-build.sh"

    - name: Verify the executable
      shell: bash
      env:
        APP_NAME: ${{ inputs.build-name }}
      run: |
        BIN="bin/${APP_NAME}.exe"
        test -f "$BIN" || { echo "no executable at $BIN"; ls -la bin; exit 1; }
        # The two bytes of a PE file. `file` is not on every Git Bash, od is.
        MAGIC="$(head -c 2 "$BIN" | od -An -tx1 | tr -d ' \n')"
        test "$MAGIC" = "4d5a" || { echo "$BIN is not a PE executable (magic $MAGIC)"; exit 1; }
        SIZE="$(stat -c%s "$BIN")"
        test "$SIZE" -gt 1000000 || { echo "$BIN is only $SIZE bytes; the link did not finish"; exit 1; }

    # The link is static, with one exception, and this step is what keeps the exception from
    # becoming a second release that does not start.
    #
    # Windows reports the first DLL it cannot find, which is how "libexpat-1.dll could not be
    # found" reached a release: the zip shipped the executable and Resources/, and the
    # executable had been linked against mingw import libraries. So the rule now is not "no
    # DLLs" but "no DLL that is not in the zip". libjxl in MSYS2 was compiled against a shared
    # highway, so libhwy is dynamic and the rest is not; whatever the link leaves dynamic
    # travels with the build, and its own dependencies travel too.
    #
    # The closure is computed rather than listed. A hard-coded list is a list that goes stale
    # the first time a package changes, and the failure would be a missing DLL again.
    - name: Collect the libraries the binaries still import
      shell: bash
      env:
        APP_NAME: ${{ inputs.build-name }}
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        set -euo pipefail
        MINGW="$(cygpath -u "$MSYS2_LOCATION")/mingw64/bin"
        PLUGIN="build/ofxhost-native/bundled/OfxHost.ofx.bundle/Contents/Win64/OfxHost.ofx"
        WORK="$(mktemp -d)"
        : > "$WORK/needed"

        # Only mingw's own libraries can be missing. A Windows system DLL lives in System32
        # and is on the loader's search path by definition.
        for BINARY in "bin/${APP_NAME}.exe" "$PLUGIN"; do
          objdump -p "$BINARY" | awk '/DLL Name:/{print $3}' | grep -i '^lib' >> "$WORK/needed" || true
        done

        # A shipped DLL has its own imports, and a copy has the same problem one level down.
        # One round reads a snapshot and writes the accumulated set, so the file is never read
        # while it is appended to. The loop stops when a round adds nothing.
        while : ; do
          sort -u "$WORK/needed" -o "$WORK/needed"
          cp "$WORK/needed" "$WORK/round"
          while read -r DLL; do
            [ -n "$DLL" ] || continue
            test -f "$MINGW/$DLL" || { echo "$DLL is imported and is not in $MINGW"; exit 1; }
            cp -f "$MINGW/$DLL" bin/
            objdump -p "$MINGW/$DLL" | awk '/DLL Name:/{print $3}' | grep -i '^lib' >> "$WORK/needed" || true
          done < "$WORK/round"
          sort -u "$WORK/needed" -o "$WORK/needed"
          cmp -s "$WORK/needed" "$WORK/round" && break
        done

        if [ ! -s "$WORK/needed" ]; then
          echo "both binaries are fully static: nothing is shipped beside them"
          exit 0
        fi
        echo "shipped beside the executable:"
        cat "$WORK/needed"

    # What the executable and the plugin import must be exactly what the zip carries. This is
    # the assertion the first attempt lacked, and it is stated as a comparison so it keeps
    # working whether the link leaves nothing dynamic or one library.
    - name: Check every library the binaries import is shipped
      shell: bash
      env:
        APP_NAME: ${{ inputs.build-name }}
      run: |
        set -euo pipefail
        PLUGIN="build/ofxhost-native/bundled/OfxHost.ofx.bundle/Contents/Win64/OfxHost.ofx"
        FAILED=0
        for BINARY in "bin/${APP_NAME}.exe" "$PLUGIN"; do
          echo "== imports of $BINARY"
          IMPORTS="$(objdump -p "$BINARY" | awk '/DLL Name:/{print $3}')"
          echo "$IMPORTS" | sed '/^$/d' | sort
          while read -r DLL; do
            [ -n "$DLL" ] || continue
            case "$DLL" in
              lib*|Lib*) ;;
              *) continue ;;
            esac
            if [ ! -f "bin/$DLL" ]; then
              echo "$BINARY imports $DLL, which the zip does not carry"
              FAILED=1
            fi
          done <<< "$IMPORTS"
        done
        if [ "$FAILED" -ne 0 ]; then
          echo "A DLL the build needs is missing from the package. The collect step copies the"
          echo "closure from MSYS2's mingw64/bin; a name it cannot find means the library was"
          echo "dropped from the install list, or the link found it somewhere else."
          exit 1
        fi
        echo "every library the binaries import is in the package"

    - name: Package
      id: package
      if: inputs.package == 'true'
      shell: pwsh
      env:
        APP_NAME: ${{ inputs.build-name }}
        TARGET_ARCH: ${{ steps.target.outputs.arch }}
      run: |
        $pkg = "$env:APP_NAME-windows-$env:TARGET_ARCH"
        Remove-Item -Recurse -Force "bin\Resources" -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path "bin\Resources" | Out-Null
        Copy-Item -Recurse -Force "build\ofxhost-native\bundled\OfxHost.ofx.bundle" "bin\Resources\"
        if (-not (Test-Path "bin\Resources\OfxHost.ofx.bundle\Contents\Win64\OfxHost.ofx")) {
          throw "the plugin bundle did not survive the copy"
        }
        # The DLLs the link left dynamic, if any. -Path with a wildcard that matches nothing
        # makes Compress-Archive fail, so the list is built first.
        $items = @("bin\$env:APP_NAME.exe", "bin\Resources")
        $dlls = Get-ChildItem -Path "bin" -Filter "*.dll" -File -ErrorAction SilentlyContinue
        if ($dlls) { $items += $dlls.FullName }
        Compress-Archive -Path $items -DestinationPath "bin\$pkg.zip" -Force
        $hash = (Get-FileHash -Path "bin\$pkg.zip" -Algorithm SHA256).Hash.ToLower()
        # The sha256sum format, so the file checks with the same command as every other
        # artefact: hash, two spaces, file name.
        Set-Content -Path "bin\$pkg.zip.sha256" -Value "$hash  $pkg.zip" -NoNewline -Encoding ascii
        "path=bin/$pkg.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Verify the zip carries the executable and its effects
      if: inputs.package == 'true'
      shell: pwsh
      env:
        APP_NAME: ${{ inputs.build-name }}
        TARGET_ARCH: ${{ steps.target.outputs.arch }}
      run: |
        $pkg = "$env:APP_NAME-windows-$env:TARGET_ARCH"
        $archive = Resolve-Path "bin\$pkg.zip"
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [IO.Compression.ZipFile]::OpenRead($archive)
        $names = $zip.Entries | ForEach-Object { $_.FullName }
        $zip.Dispose()
        $names | Write-Output
        if (-not ($names -match "^$env:APP_NAME\.exe$")) { throw "the archive has no $env:APP_NAME.exe at the top" }
        if (-not ($names -match '^Resources[\\/].*OfxHost\.ofx$')) { throw "the archive carries no plugin binary" }
        # Every DLL the step above copied must have travelled with the archive.
        $dlls = Get-ChildItem -Path "bin" -Filter "*.dll" -File -ErrorAction SilentlyContinue
        foreach ($dll in $dlls) {
          if (-not ($names -contains $dll.Name)) { throw "the archive is missing $($dll.Name)" }
        }

    - name: Upload the build
      if: inputs.package == 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.build-name }}-windows-${{ steps.target.outputs.arch }}
        path: |
          bin/${{ inputs.build-name }}-windows-${{ steps.target.outputs.arch }}.zip
          bin/${{ inputs.build-name }}-windows-${{ steps.target.outputs.arch }}.zip.sha256
        if-no-files-found: error
