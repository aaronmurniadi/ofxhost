name: "Build the Linux app (Wails v3)"
description: >-
  Builds the application for Linux and packs the binary with its plugin bundle into
  a tarball. The macOS sibling is wails3-macos; this one differs only where the
  platform does. Read the header comment for why there is no AppImage.

# ---------------------------------------------------------------------------------------
# A tarball, not an AppImage.
#
# An AppImage was built here first. `wails3 generate appimage` fetches linuxdeploy from
# GitHub's release downloads at run time, and that URL answered `504 Gateway Timeout` on
# every attempt, for the continuous tag and for a pinned one: the generator cannot be pointed
# at a mirror and has no working switch to skip the fetch. The download path was the problem,
# not the runner, and turning a release into a race against a third party's CDN for a tool
# nobody here controls is not worth the artefact.
#
# A tarball needs no FUSE, no linuxdeploy, no appimagetool and no network beyond the module
# downloads every job already makes. It also removes the second packing pass the AppImage
# needed to carry the plugin bundle at usr/lib/ofxhost.
#
# The layout is the one internal/adapter/ofxhost/bundled.go already searches on every
# platform: the executable with a Resources directory beside it:
#
#   ofxhost-linux-x86_64/
#     ofxhost
#     Resources/OfxHost.ofx.bundle/Contents/Linux-x86-64/OfxHost.ofx
#
# Ctrl-C or a double-click in a file manager runs the binary directly; nothing needs to be
# installed or mounted.
#
# The rest is the same shape as the macOS action: pinned Go and Node, the CMake archive
# first, the bindings, the tests, a checksum and an artifact.
# ---------------------------------------------------------------------------------------

inputs:
  build-name:
    description: "Base name of the archive. Also what the binary is called."
    required: false
    default: ofxhost
  build-platform:
    description: "Target platform. linux/x86_64 or linux/amd64, nothing else for now."
    required: false
    default: linux/x86_64
  go-version:
    description: "Go version to install."
    required: false
    default: '1.26'
  node-version:
    description: "Node version to install."
    required: false
    default: '22'
  wails-version:
    description: "Wails v3 CLI version to install. Pinned, not latest."
    required: false
    default: v3.1.0
  task-version:
    description: "go-task version to install."
    required: false
    default: v3.54.0
  version:
    description: "Version string to embed with -X main.version. The About panel shows it."
    required: false
    default: 'dev'
  package:
    description: "Write the checksum and upload the tarball as an artifact."
    required: false
    default: 'true'

outputs:
  arch:
    description: "Architecture as the artifact names it: x86_64."
    value: ${{ steps.target.outputs.arch }}
  archive:
    description: "Path to the tarball, empty when package is false."
    value: ${{ steps.package.outputs.path }}

runs:
  using: "composite"
  steps:
    - name: Resolve the target
      id: target
      shell: bash
      env:
        BUILD_PLATFORM: ${{ inputs.build-platform }}
      run: |
        case "$BUILD_PLATFORM" in
          linux/x86_64|linux/amd64)
            arch=x86_64
            goarch=amd64
            ;;
          *)
            echo "unsupported build-platform: $BUILD_PLATFORM" >&2
            echo "this workflow builds linux/x86_64 only" >&2
            exit 1
            ;;
        esac
        echo "arch=$arch" >> "$GITHUB_OUTPUT"
        echo "goarch=$goarch" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # GTK4 and WebKitGTK 6.0, not GTK3: Wails v3 links those by default and needs the `gtk3`
    # build tag to want the others, which would have to be passed to the CLI and to the
    # application. The rest are the same libraries the macOS job installs from Homebrew.
    - name: Install native dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build pkg-config file \
          libgtk-4-dev libwebkitgtk-6.0-dev \
          libraw-dev liblcms2-dev libexpat1-dev \
          libpng-dev libtiff-dev libjpeg-dev libwebp-dev libjxl-dev \
          libgl1-mesa-dev

    - name: Install build tools
      shell: bash
      env:
        WAILS_VERSION: ${{ inputs.wails-version }}
        TASK_VERSION: ${{ inputs.task-version }}
      run: |
        go install "github.com/go-task/task/v3/cmd/task@${TASK_VERSION}"
        go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    # cgo links build/ofxhost-native/lib/libofxhost.a, which CMake produces. The plugins are
    # built by the same command, and OFX loads them from a bundle on disk, so the bundle has
    # to exist before the tarball is assembled around it.
    - name: Build the native library and the bundled plugins
      shell: bash
      run: |
        cmake -S internal/adapter/ofxhost/native \
              -B build/ofxhost-native \
              -DCMAKE_BUILD_TYPE=Release
        cmake --build build/ofxhost-native -j "$(nproc)"

    - name: Verify the native build produced what the link needs
      shell: bash
      run: |
        test -f build/ofxhost-native/lib/libofxhost.a \
          || { echo "libofxhost.a is missing; the CMake step did not run or failed"; exit 1; }
        test -d build/ofxhost-native/bundled/OfxHost.ofx.bundle \
          || { echo "the bundled plugins are missing; the app would ship with fewer effects"; exit 1; }
        # The bundle's binary goes in Contents/<arch>/, and Linux reads Linux-x86-64. A
        # bundle under Contents/MacOS is found by no host, and the failure is an empty picker.
        test -f build/ofxhost-native/bundled/OfxHost.ofx.bundle/Contents/Linux-x86-64/OfxHost.ofx \
          || { echo "the bundled plugins are not in Contents/Linux-x86-64"; exit 1; }

    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: npm ci

    - name: Generate the Wails bindings
      shell: bash
      run: wails3 generate bindings

    - name: Test
      shell: bash
      run: |
        go test ./...
        go run ./tools/layerguard
        cd frontend && npm test

    # `task linux:build` builds the frontend, the bindings, the version assets and the binary
    # into bin/, which is the same path a local build uses.
    - name: Build the binary
      shell: bash
      env:
        GOARCH: ${{ steps.target.outputs.goarch }}
        # Read by the Taskfile as -X main.version, so a released build names the tag it came
        # from instead of saying "dev".
        VERSION: ${{ inputs.version }}
      run: task linux:build

    - name: Verify the binary
      shell: bash
      env:
        APP_NAME: ${{ inputs.build-name }}
      run: |
        BIN="bin/${APP_NAME}"
        test -x "$BIN" || { echo "no binary at $BIN"; ls -la bin; exit 1; }
        file "$BIN" | grep -q 'ELF 64-bit' \
          || { echo "$BIN is not an ELF64 executable"; file "$BIN"; exit 1; }
        # A binary whose libraries are not on the runner would start for the person who built
        # it and fail for nobody else. Every dependency must resolve here.
        if ldd "$BIN" | grep -q 'not found'; then
          echo "the binary has unresolved libraries:" >&2
          ldd "$BIN" | grep 'not found' >&2
          exit 1
        fi

    # The staging directory keeps the archive's paths relative, so untarring it makes one
    # folder rather than four files in whatever directory the user is standing in.
    - name: Package
      id: package
      if: inputs.package == 'true'
      shell: bash
      env:
        APP_NAME: ${{ inputs.build-name }}
        TARGET_ARCH: ${{ steps.target.outputs.arch }}
      run: |
        PKG="${APP_NAME}-linux-${TARGET_ARCH}"
        STAGE="build/linux/package/${PKG}"
        rm -rf "build/linux/package"
        mkdir -p "${STAGE}/Resources"
        cp "bin/${APP_NAME}" "${STAGE}/"
        cp -R build/ofxhost-native/bundled/OfxHost.ofx.bundle "${STAGE}/Resources/"
        tar -czf "bin/${PKG}.tar.gz" -C build/linux/package "${PKG}"
        # Written from inside the directory so the file names only the archive. A checksum
        # that records "bin/..." cannot be checked by anyone who downloaded the two files
        # into one folder, which is the only thing a checksum is for.
        ( cd bin && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256" )
        echo "path=bin/${PKG}.tar.gz" >> "$GITHUB_OUTPUT"

    - name: Verify the tarball carries the binary and its effects
      if: inputs.package == 'true'
      shell: bash
      env:
        APP_NAME: ${{ inputs.build-name }}
        TARGET_ARCH: ${{ steps.target.outputs.arch }}
      run: |
        PKG="${APP_NAME}-linux-${TARGET_ARCH}"
        ARCHIVE="bin/${PKG}.tar.gz"
        test -f "$ARCHIVE" || { echo "no archive at $ARCHIVE"; ls -la bin; exit 1; }
        rm -rf /tmp/package-check && mkdir -p /tmp/package-check
        tar -xzf "$ARCHIVE" -C /tmp/package-check
        test -x "/tmp/package-check/${PKG}/${APP_NAME}" \
          || { echo "the archive has no executable"; find /tmp/package-check -maxdepth 3; exit 1; }
        find "/tmp/package-check/${PKG}/Resources" -name '*.ofx.bundle' | grep -q . \
          || { echo "the archive carries no plugins"; find /tmp/package-check -maxdepth 4; exit 1; }

    - name: Upload the build
      if: inputs.package == 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.build-name }}-linux-${{ steps.target.outputs.arch }}
        path: |
          bin/${{ inputs.build-name }}-linux-${{ steps.target.outputs.arch }}.tar.gz
          bin/${{ inputs.build-name }}-linux-${{ steps.target.outputs.arch }}.tar.gz.sha256
        if-no-files-found: error
