name: CI

# Checks every pull request and every push to the main branch.
#
# Why this exists: the repository's rules were enforced by AGENTS.md and by hand. Nothing
# ran `go test` on a normal pull request, so the layer guard, the race detector and the
# frontend type check were only as reliable as the person who remembered them. A rule that
# a machine does not check is a rule that will be broken.
#
# The frontend job runs `wails3 generate bindings` before it type-checks. That is not
# optional: frontend/bindings is gitignored, the Wails vite plugin resolves it while
# vite.config.ts is being loaded, and without it vitest fails before the first test.
#
# The release workflow builds all three platforms. This one proves the code, and it proves
# it on the two platforms where the C++ and the cgo tagging actually differ. Windows is left
# to release.yml: its MSYS2 toolchain takes longer to set up than the check is worth on
# every push, and the release job already compiles it.

on:
  push:
    branches:
      - main
  pull_request:

# A second push to the same branch cancels the first. The result of the older commit is not
# interesting once a newer one exists.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  GOLANGCI_VERSION: v2.5.0
  # Pinned to the version release.yml builds with, so a binding generated here is the same
  # binding a release ships.
  WAILS_VERSION: v3.1.0

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    steps:
      # The OpenFX headers and HostSupport are a submodule. Without it CMake stops at
      # "The OpenFX submodule is missing", which reads like a build fault and is a checkout
      # one. Both Go jobs and the lint job build the native library.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The native libraries cgo links. The link line names all of them, so a missing one
      # is a link error rather than a feature discovered missing at runtime.
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install libraw lcms2 libpng libtiff jpeg-turbo webp jpeg-xl expat

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libraw-dev liblcms2-dev libexpat1-dev \
            libpng-dev libtiff-dev libjpeg-dev libwebp-dev libjxl-dev \
            libgl1-mesa-dev

      # cgo links build/ofxhost-native/lib/libofxhost.a, which CMake produces, and the tests
      # in internal/app load the bundled plugins from the same build. Skipping this step
      # fails the link, and the failure reads like a Go problem.
      - name: Build the native library and the bundled plugins
        shell: bash
        run: |
          cmake -S internal/adapter/ofxhost/native \
                -B build/ofxhost-native \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ofxhost-native -j "$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)"

      - name: Vet
        run: go vet ./...

      # The dependency rule, run on its own so a violation is one line in the log rather
      # than a failing test somewhere in the middle of the list.
      - name: Layer guard
        run: go run ./tools/layerguard

      # The race detector is the point of this job. Two of the defects this repository has
      # had were field reads with no lock, and neither could be seen without it.
      - name: Test
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libraw-dev liblcms2-dev libexpat1-dev \
            libpng-dev libtiff-dev libjpeg-dev libwebp-dev libjxl-dev \
            libgl1-mesa-dev

      - name: Build the native library
        run: |
          cmake -S internal/adapter/ofxhost/native -B build/ofxhost-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ofxhost-native -j "$(nproc)"

      # The CGO packages are compiled but not type-checked in depth; this is what makes the
      # lint run about the Go code rather than about the cgo preamble.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          args: --timeout=5m

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # The submodule is here for the bindings generator, not for a build: it reads the Go
      # packages, and the adapter packages name headers from third_party/openfx.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: npm ci

      # vite.config.ts loads the Wails vite plugin, and that plugin resolves the generated
      # event bindings as soon as the config is read. frontend/bindings is gitignored, so on
      # a clean checkout vitest died before it ran a test: "Event bindings module not found".
      # Generating them is also what makes the type check see the real service types.
      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Generate the Wails bindings
        working-directory: .
        run: wails3 generate bindings

      # TypeScript first: a type error is a compile failure, and the unit tests cannot see
      # one that the compiler would have caught in a second.
      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
