name: Release

# Builds the application for macOS (both architectures) and for Linux, and attaches the
# artefacts to a release.
#
# The work is in .github/actions/wails3-macos and .github/actions/wails3-linux, one call per
# runner. Those actions are the Wails Build Action's shape - pinned Go and Node, a build, a
# signed .app or an AppImage, a checksum, an artifact - with its two Wails v2 steps replaced
# by their v3 equivalents. The header of the macOS action records why the upstream action
# cannot build this project: it installs the v2 CLI and calls `wails build --platform ...
# -o ...`, and the v3 CLI has neither flag.
#
# macOS is two jobs, not one universal build. Each architecture links its own Homebrew
# bottles, so each needs a runner of its own architecture: macos-15 for arm64,
# macos-15-intel for x86_64. A universal app assembled across two runners would need a lipo
# merge over every Mach-O file in the bundle, which is more moving parts than a second job.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v0.2.0). Leave empty to build only.'
        required: false
        type: string
      publish:
        description: 'Publish a release for that tag. Off builds the artefacts and stops.'
        required: false
        type: boolean
        default: false
      platforms:
        description: 'Which platforms to build. A manual run can build one to test it.'
        required: false
        type: choice
        default: all
        options:
          - all
          - macos
          - linux
          - windows
  # A pull request that changes the pipeline itself, and nothing else. Three builds take a
  # while, so it is not something every pull request should pay for; a manual run does the
  # same job with a button.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/actions/**'

permissions:
  contents: write

env:
  APP_NAME: ofxhost
  # Pinned rather than "latest": a release build should change because the code changed,
  # not because a tool moved under it.
  WAILS_VERSION: v3.1.0
  TASK_VERSION: v3.54.0
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    # A manual run names the platform it wants. A tag push and a pull request build all of
    # them, because a release with one platform missing is not a release.
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `arch` names the artifact, `goarch` is what the toolchain is told. They are not the
        # same word for Intel: Go calls it amd64, and GOARCH=x86_64 is not a GOOS/GOARCH pair
        # at all, so `go env` fails before a single file is compiled.
        include:
          - arch: arm64
            goarch: arm64
            # macos-14 resolves to a configuration this repository cannot use; macos-15 is the
            # current arm64 image and the one that runs.
            runner: macos-15
          # macos-13 was retired, and a job queued on it waits forever rather than failing.
          # macos-15-intel is the current Intel image.
          - arch: x86_64
            goarch: amd64
            runner: macos-15-intel

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          # The OpenFX headers and HostSupport are a submodule, and the host does not
          # compile without them.
          submodules: recursive

      - name: Build, verify and package
        uses: ./.github/actions/wails3-macos
        with:
          build-name: ${{ env.APP_NAME }}
          build-platform: darwin/${{ matrix.arch }}
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          wails-version: ${{ env.WAILS_VERSION }}
          task-version: ${{ env.TASK_VERSION }}

  # One job. The AppImage is the only Linux artefact, and the runner is x86_64 to match it.
  linux:
    name: Linux (${{ matrix.arch }})
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            goarch: amd64

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Build, verify and package
        uses: ./.github/actions/wails3-linux
        with:
          build-name: ${{ env.APP_NAME }}
          build-platform: linux/${{ matrix.arch }}
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          wails-version: ${{ env.WAILS_VERSION }}
          task-version: ${{ env.TASK_VERSION }}

  # One job. The zip is the only Windows artefact, and the runner is x86_64 to match it.
  windows:
    name: Windows (${{ matrix.arch }})
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            goarch: amd64

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Build, verify and package
        uses: ./.github/actions/wails3-windows
        with:
          build-name: ${{ env.APP_NAME }}
          build-platform: windows/${{ matrix.arch }}
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          wails-version: ${{ env.WAILS_VERSION }}
          task-version: ${{ env.TASK_VERSION }}

  release:
    name: Publish the release
    needs: [macos, linux, windows]
    # A release needs every platform, so a manual run that built one of them does not publish.
    # Without the all-platforms test, this job would fail against the artifacts it did not build.
    if: |
      (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
      && (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Collect the builds
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -la dist

      - name: Publish
        uses: softprops/action-gh-release@v3.0.4
        with:
          # A tag push names itself. A manual run needs the tag, and refusing without one
          # keeps a release from being published against the default branch.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
