name: Release

# Builds the application for macOS, Linux and Windows, and attaches the three artefacts to a
# release.
#
# The actions are pinned to exact versions, not major-version tags. A release build should
# change because the code changed; a floating tag lets an action update itself under a green
# pipeline. The pins are also what the runner support for Node 24 requires - an action left on a
# Node 20 build still runs, but it is forced onto Node 24 and warns on every job.
#
# Three things make this workflow look the way it does, and each is worth stating.
#
# The native library is built first and by hand on every platform. `wails3 build` runs
# `go build`, and cgo links against build/ofxhost-native/lib/libofxhost.a, which CMake
# produces. A workflow that skipped the CMake step would produce a binary without the OpenFX
# host, or no binary at all — the failure looks like a Go problem and is not one.
#
# The plugins are part of the build, not an extra: the bundle target is in the default CMake
# build, so one `cmake --build` produces the host library and the bundled plugins together.
# They are then copied into the artefact, because OFX loads a plugin from a bundle on disk and
# a program that cannot find its own effects starts with an empty picker.
#
# One macOS build, not two. The runners that could build each slice with its own Homebrew
# libraries are two machines, and a universal application assembled from two machines needs a
# lipo merge over every Mach-O file in the bundle. Building both slices in one job is simpler:
# the C++ is configured with CMAKE_OSX_ARCHITECTURES and comes out fat in one pass, and the
# Intel Homebrew libraries sit at /usr/local, which is already on the link line.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v0.2.0). Leave empty to build only.'
        required: false
        type: string
      publish:
        description: 'Publish a release for that tag. Off builds the artefacts and stops.'
        required: false
        type: boolean
        default: false
  # A pull request that changes the pipeline itself, and nothing else. Building three platforms
  # takes the better part of an hour, so it is not something every pull request should pay for;
  # a manual run with `publish` off does the same job with a button.
  pull_request:
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

env:
  APP_NAME: ofxhost
  # Pinned rather than "latest": a release build should change because the code changed,
  # not because a tool moved under it.
  WAILS_VERSION: v3.1.0
  TASK_VERSION: v3.54.0
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------------------
  # macOS: one universal application, arm64 and x86_64.
  #
  # The two slices need two sets of libraries. Apple's clang can emit either architecture from
  # one machine, but a Homebrew bottle is single-architecture, so the Intel slice links against
  # /usr/local (Homebrew under Rosetta) while the arm64 slice links against /opt/homebrew. The
  # Go package's darwin cgo files already search both prefixes.
  # ---------------------------------------------------------------------------------------
  macos:
    name: macOS (universal)
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      # The cgo link line is generated by the toolchain, so the floor has to arrive through
      # all three variables. CGO_CFLAGS does not reach C++: CGO_CXXFLAGS does.
      CGO_CFLAGS: '-mmacosx-version-min=12.0'
      CGO_CXXFLAGS: '-mmacosx-version-min=12.0'
      CGO_LDFLAGS: '-mmacosx-version-min=12.0'

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          # The OpenFX headers and HostSupport are a submodule, and the host does not
          # compile without them.
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # libraw decodes the RAW; lcms2 does the colour conversion; the rest write the export
      # formats. expat parses the plugin XML. The arm64 copies land in /opt/homebrew.
      - name: Install native dependencies (arm64)
        run: |
          brew install \
            libraw lcms2 libpng libtiff jpeg-turbo webp jpeg-xl expat

      # The Intel slice links its own copies, and a bottle is built for the machine that
      # installed it. Homebrew under Rosetta puts x86_64 bottles in /usr/local, exactly the
      # prefix the darwin cgo files already name.
      - name: Install Rosetta
        run: |
          if ! /usr/bin/pgrep -q oahd; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Install native dependencies (x86_64)
        run: |
          # A clone into /usr/local, not the installer: the installer refuses a machine that
          # already has Homebrew, and on Apple Silicon it already does. This is Homebrew's own
          # documented way to run a second prefix, and under Rosetta it fetches x86_64 bottles.
          if [ ! -x /usr/local/bin/brew ]; then
            sudo mkdir -p /usr/local
            sudo chown -R "$(whoami)" /usr/local
            git clone --depth=1 https://github.com/Homebrew/brew /usr/local/Homebrew
            mkdir -p /usr/local/bin
            ln -sf /usr/local/Homebrew/bin/brew /usr/local/bin/brew
          fi
          arch -x86_64 /usr/local/bin/brew install \
            libraw lcms2 libpng libtiff jpeg-turbo webp jpeg-xl expat

      - name: Install build tools
        run: |
          brew install go-task
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # One configure, two architectures: CMake drives clang twice per file and the archiver
      # writes a fat archive. Both Go slices link the same file, which is what makes a single
      # `task darwin:package:universal` possible.
      - name: Build the native library and the bundled plugins (universal)
        run: |
          cmake -S internal/adapter/ofxhost/native \
                -B build/ofxhost-native \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build/ofxhost-native -j "$(sysctl -n hw.ncpu)"

      - name: Verify the native build is universal
        run: |
          test -f build/ofxhost-native/lib/libofxhost.a \
            || { echo "libofxhost.a is missing; the CMake step did not run or failed"; exit 1; }
          lipo -info build/ofxhost-native/lib/libofxhost.a
          # An archive with one slice links one Go architecture and fails the other with a
          # message about the file being built for a different platform, pointed at cgo.
          lipo -info build/ofxhost-native/lib/libofxhost.a | grep -q x86_64 \
            || { echo "the archive has no x86_64 slice"; exit 1; }
          lipo -info build/ofxhost-native/lib/libofxhost.a | grep -q arm64 \
            || { echo "the archive has no arm64 slice"; exit 1; }
          PLUGIN=build/ofxhost-native/bundled/OfxHost.ofx.bundle/Contents/MacOS/OfxHost.ofx
          test -f "$PLUGIN" || { echo "the bundled plugins are missing"; exit 1; }
          lipo -info "$PLUGIN" | grep -q x86_64 || { echo "the plugin has no x86_64 slice"; exit 1; }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate the Wails bindings
        run: |
          # The bindings are generated, and .gitignore keeps them out of the repository. The
          # frontend's Vite config asks for the typed-events module at build start, so a
          # checkout without this step fails the frontend tests with "Event bindings module not
          # found" - a message about the bindings, not about the code under test.
          wails3 generate bindings

      - name: Test
        run: |
          go test ./...
          go run ./tools/layerguard
          cd frontend && npm test

      - name: Build the universal application bundle
        run: |
          # Builds both slices, lipos the executable, and assembles one .app around it, copying
          # the bundled plugins into Resources and ad-hoc signing the result.
          task darwin:package:universal

      - name: Verify the app bundle
        run: |
          APP="bin/${APP_NAME}.app"
          test -d "$APP" || { echo "no app bundle at $APP"; ls -la bin; exit 1; }
          lipo -info "$APP/Contents/MacOS/${APP_NAME}"
          lipo -info "$APP/Contents/MacOS/${APP_NAME}" | grep -q x86_64 \
            || { echo "the executable has no x86_64 slice"; exit 1; }
          lipo -info "$APP/Contents/MacOS/${APP_NAME}" | grep -q arm64 \
            || { echo "the executable has no arm64 slice"; exit 1; }
          # A bundle that opens but discovers no plugins is the failure this catches: the
          # plugin bundle has to be inside Resources, because the upward search for the CMake
          # output does not find anything once the app is installed.
          find "$APP/Contents/Resources" -maxdepth 3 -name '*.ofx.bundle' | grep -q . \
            || { echo "the app bundle carries no plugins"; ls -la "$APP/Contents/Resources"; exit 1; }
          for plugin in "$APP"/Contents/Resources/*.ofx.bundle/Contents/MacOS/*.ofx; do
            lipo -info "$plugin" | grep -q x86_64 \
              || { echo "$plugin has no x86_64 slice"; exit 1; }
          done

      - name: Verify the signature
        run: |
          # The packaging task signs ad hoc, which is what the local build does. Checking it
          # here means a signing change fails the release rather than the user's first launch.
          codesign --verify --deep --strict "bin/${APP_NAME}.app"
          # A signature over one slice of a universal binary is a signature macOS rejects on
          # the other one, so the check above is only honest after this one passes.
          codesign --display --verbose=2 "bin/${APP_NAME}.app" 2>&1 | grep -q 'Format=fat' \
            || echo "note: the bundle is not fat according to codesign"

      - name: Package
        run: |
          # ditto, not zip: it preserves the resource forks and permissions an app bundle
          # needs, and a bundle unzipped with a plain zip quietly loses them.
          ditto -c -k --sequesterRsrc --keepParent \
            "bin/${APP_NAME}.app" \
            "bin/${APP_NAME}-macOS-universal.zip"
          # Written from inside the directory so the file names only the archive. A checksum
          # that records "bin/..." cannot be checked by anyone who downloaded the two files
          # into one folder, which is the only thing a checksum is for.
          ( cd bin && shasum -a 256 "${APP_NAME}-macOS-universal.zip" \
              > "${APP_NAME}-macOS-universal.zip.sha256" )

      - name: Upload the build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.APP_NAME }}-macOS-universal
          path: |
            bin/${{ env.APP_NAME }}-macOS-universal.zip
            bin/${{ env.APP_NAME }}-macOS-universal.zip.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------
  # Linux: one AppImage.
  #
  # `wails3 generate appimage` runs linuxdeploy with its GTK plugin, which is what makes the
  # WebKit helper processes work inside an AppImage. The plugin bundle is added to the AppDir
  # afterwards and the AppImage is packed again with appimagetool, because the generator has no
  # way to carry extra files and the host looks for its effects in usr/lib/ofxhost.
  # ---------------------------------------------------------------------------------------
  linux:
    name: Linux (x86_64 AppImage)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # GTK4 and WebKitGTK 6.0, not GTK3: Wails v3 links those by default and needs the `gtk3`
      # build tag to want the others, which would have to be passed to the CLI as well as to
      # the application. The rest are the same libraries the macOS job installs from Homebrew.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libraw-dev liblcms2-dev libexpat1-dev \
            libpng-dev libtiff-dev libjpeg-dev libwebp-dev libjxl-dev \
            libgl1-mesa-dev

      - name: Install build tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build the native library and the bundled plugins
        run: |
          cmake -S internal/adapter/ofxhost/native \
                -B build/ofxhost-native \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ofxhost-native -j "$(nproc)"

      - name: Verify the native build produced what the link needs
        run: |
          test -f build/ofxhost-native/lib/libofxhost.a \
            || { echo "libofxhost.a is missing; the CMake step did not run or failed"; exit 1; }
          test -d build/ofxhost-native/bundled/OfxHost.ofx.bundle \
            || { echo "the bundled plugins are missing; the app would ship with fewer effects"; exit 1; }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate the Wails bindings
        run: wails3 generate bindings

      - name: Test
        run: |
          go test ./...
          go run ./tools/layerguard
          cd frontend && npm test

      - name: Build and package the AppImage
        run: |
          task linux:create:appimage
          # The generator names the AppDir after the binary and the architecture.
          APPDIR=build/linux/appimage/build/${APP_NAME}-x86_64.AppDir
          test -d "$APPDIR" || { echo "no AppDir at $APPDIR"; ls -la build/linux/appimage/build; exit 1; }
          mkdir -p "$APPDIR/usr/lib/${APP_NAME}"
          cp -R build/ofxhost-native/bundled/OfxHost.ofx.bundle "$APPDIR/usr/lib/${APP_NAME}/"

      - name: Pack the AppImage
        run: |
          # The generator already produced a working AppImage. It is packed again from the same
          # AppDir only because the plugin bundle was added after it ran, and packing is the
          # last step.
          ARCH=x86_64
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage
          chmod +x /tmp/appimagetool
          ARCH=${ARCH} /tmp/appimagetool --appimage-extract-and-run \
            build/linux/appimage/build/${APP_NAME}-x86_64.AppDir \
            "bin/${APP_NAME}-linux-${ARCH}.AppImage"
          ( cd bin && sha256sum "${APP_NAME}-linux-${ARCH}.AppImage" \
              > "${APP_NAME}-linux-${ARCH}.AppImage.sha256" )

      - name: Verify the AppImage carries its effects
        run: |
          APPIMAGE="bin/${APP_NAME}-linux-x86_64.AppImage"
          test -f "$APPIMAGE" || { echo "no AppImage at $APPIMAGE"; ls -la bin; exit 1; }
          test -x "$APPIMAGE" || chmod +x "$APPIMAGE"
          # Extract rather than mount: a runner has no FUSE, and the contents are what is
          # being checked.
          ( cd /tmp && rm -rf appimage-check && mkdir appimage-check )
          ( cd /tmp/appimage-check && "$OLDPWD/$APPIMAGE" --appimage-extract > /dev/null )
          test -x /tmp/appimage-check/squashfs-root/usr/bin/${APP_NAME} \
            || { echo "the AppImage has no executable"; exit 1; }
          find /tmp/appimage-check/squashfs-root/usr/lib/${APP_NAME} -name '*.ofx.bundle' | grep -q . \
            || { echo "the AppImage carries no plugins"; exit 1; }

      - name: Upload the build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.APP_NAME }}-linux-x86_64
          path: |
            bin/${{ env.APP_NAME }}-linux-x86_64.AppImage
            bin/${{ env.APP_NAME }}-linux-x86_64.AppImage.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------
  # Windows: a zip with the executable and the plugin bundle beside it.
  #
  # MSYS2's mingw-w64 packages are the only C toolchain cgo can drive on Windows: MSVC cannot
  # be used by cgo, and the OFX host support library is built by the same compiler here.
  # ---------------------------------------------------------------------------------------
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # libraw, lcms2, expat and the encoders, all as mingw-w64 import libraries. gcc because
      # cgo cannot drive MSVC; cmake and ninja for the OpenFX host archive.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libraw
            mingw-w64-x86_64-lcms2
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-libjxl
            zip

      - name: Install the Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build the native library and the bundled plugins
        run: |
          cmake -S internal/adapter/ofxhost/native \
                -B build/ofxhost-native \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ofxhost-native

      - name: Verify the native build produced what the link needs
        run: |
          test -f build/ofxhost-native/lib/libofxhost.a \
            || { echo "libofxhost.a is missing; the CMake step did not run or failed"; exit 1; }
          # OFX reads Contents/Win64 on Windows. A plugin under Contents/MacOS is found by no
          # host, and the failure is an empty picker rather than an error.
          test -f build/ofxhost-native/bundled/OfxHost.ofx.bundle/Contents/Win64/OfxHost.ofx \
            || { echo "the bundled plugins are not in Contents/Win64"; exit 1; }

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Generate the Wails bindings
        run: wails3 generate bindings

      - name: Build
        run: |
          # -H windowsgui keeps the console window away. The production tag turns off the
          # inspector, which is what Debug reads.
          cd frontend && npm run build && cd ..
          go build -tags production -trimpath \
            -ldflags="-s -w -H windowsgui" \
            -o "bin/${APP_NAME}.exe" ./cmd/ofxhost

      - name: Assemble the zip
        run: |
          # The executable at the top and the plugin bundle beside it: that is the layout the
          # host searches, and it needs no installer to work.
          mkdir -p "bin/Resources"
          cp -R build/ofxhost-native/bundled/OfxHost.ofx.bundle "bin/Resources/"
          test -f "bin/Resources/OfxHost.ofx.bundle/Contents/Win64/OfxHost.ofx" \
            || { echo "the plugin bundle did not survive the copy"; exit 1; }
          cd bin
          zip -r "${APP_NAME}-windows-x86_64.zip" "${APP_NAME}.exe" Resources
          sha256sum "${APP_NAME}-windows-x86_64.zip" > "${APP_NAME}-windows-x86_64.zip.sha256"

      - name: Upload the build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.APP_NAME }}-windows-x86_64
          path: |
            bin/${{ env.APP_NAME }}-windows-x86_64.zip
            bin/${{ env.APP_NAME }}-windows-x86_64.zip.sha256
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Collect the builds
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -la dist

      - name: Publish
        uses: softprops/action-gh-release@v3.0.4
        with:
          # A tag push names itself. A manual run needs the tag, and refusing without one
          # keeps a release from being published against the default branch.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.AppImage
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
