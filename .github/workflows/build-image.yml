name: Build Linux image

# Publishes the image the Linux release job runs in, so a release never reaches
# the Ubuntu package mirrors. Start it by hand after changing
# packaging/linux/Dockerfile.build, and once before the first release that uses
# the image.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ofxhost-linux-build:22.04

jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Log in to the container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: |
          docker build \
            --file packaging/linux/Dockerfile.build \
            --tag "$IMAGE" \
            packaging/linux
      - name: Push
        run: docker push "$IMAGE"
      - name: Report the digest
        run: |
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE"
