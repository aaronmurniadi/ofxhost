# golangci-lint configuration.
#
# The set is small on purpose. Every linter here has already found something in this
# repository or would have: `staticcheck` reports the dead branches and the pointless
# conversions, `errcheck` catches a dropped error in a path that reports to the user, and
# `unparam` catches a function whose parameter is always the same constant. A linter that
# only produces style opinions is left out, because a noisy run is a run nobody reads.
#
# Run it with `golangci-lint run` from the repository root, or through the CI lint job.
version: "2"

run:
  # The cgo packages need the native archive built first; the CI job does that. Building
  # test files as well is what makes the analysis cover the tests, which is where most of
  # this repository's Go lives.
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - nilerr
    - nolintlint
    - unparam
    - whitespace

  settings:
    errcheck:
      # A blank assignment is the repository's way of saying "this failure is deliberate".
      # The default already honours it; this spells it out so nobody "fixes" it later.
      check-blank: false
    govet:
      enable-all: true
      disable:
        # fieldalignment is a memory-layout opinion, not a defect. The structs here are
        # documented in field order that matches their meaning.
        - fieldalignment
        # shadow reports every `err` in an if-scope, which is most of idiomatic Go.
        - shadow
    misspell:
      locale: UK
      # The repository writes "colour", which is why the locale is UK. These words are not
      # prose: they are the Go standard library's package name, libjxl's and libpng's C
      # constants, and the everyday word for a file dialog.
      ignore-rules:
        - color
        - colour
        - dialogs
    unparam:
      # Test helpers take parameters a single call site does not vary; that is normal.
      check-exported: false
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    paths:
      # The vendored OpenFX tree is third-party C++ and its own project.
      - third_party
    rules:
      # A test that ignores an error is stating that the error is not the thing under test.
      - path: _test\.go
        linters:
          - errcheck
          - unparam
          - bodyclose
      # The cgo preamble is not Go: the warning is about the C, which the compiler checks.
      - path: internal/adapter
        text: "cgo"
        linters:
          - govet

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aaronmurniadi/ofxhost
